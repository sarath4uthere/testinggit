# LAB ONLY: mounting the Docker socket gives Jenkins root-level control of the host.
# Real companies use dedicated build agents, rootless builders (Kaniko/BuildKit) and policies.
services:
  jenkins:
    build: .
    user: root
    ports:
      - "8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
