apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml
# the Secret is created separately (see secret.example.yaml); the image tags are set here
images:
  - name: shop/shop-api
    newTag: dev
  - name: shop/shop-web
    newTag: dev
